name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk lanterna.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Lanterna-apk
          path: lanterna.apk

      # Pubblica l'APK come release: link diretto e sempre uguale
      # https://github.com/<utente>/<repo>/releases/latest/download/lanterna.apk
      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lanterna build ${{ github.run_number }}
          files: lanterna.apk
          make_latest: true
