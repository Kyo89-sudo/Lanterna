name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk lanterna.apk

      # In caso di errore salva i log nel ramo ci-logs (leggibile senza login)
      - name: Salva log errori
        if: failure()
        run: |
          mkdir -p /tmp/logs
          grep -nE "^e: |error:|FAILED|What went wrong|Exception|expected:|AssertionError" -A4 build.log | head -600 > /tmp/logs/errors.txt || true
          tail -400 build.log > /tmp/logs/tail.txt || true
          cp -r app/build/test-results /tmp/logs/ 2>/dev/null || true
          cd /tmp/logs
          git init -q -b ci-logs
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git add -A
          git commit -qm "log build ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-logs

      - uses: actions/upload-artifact@v4
        with:
          name: Lanterna-apk
          path: lanterna.apk

      # Pubblica l'APK come release: link diretto e sempre uguale
      # https://github.com/<utente>/<repo>/releases/latest/download/lanterna.apk
      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lanterna build ${{ github.run_number }}
          files: lanterna.apk
          make_latest: true
